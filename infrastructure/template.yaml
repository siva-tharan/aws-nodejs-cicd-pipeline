AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  End-to-end CI/CD for a Node.js app - a push to GitHub starts CodePipeline (V2), which hands
  the revision to CodeDeploy to install on an EC2 instance with automatic rollback. GitHub is
  connected through CodeConnections (no personal access tokens); admin access via SSM.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    arch: GitHub --(CodeConnections)--> CodePipeline Source -> artifact S3 -> CodeDeploy (EC2 tag filter) -> EC2 (CodeDeploy agent, Node.js app on :80)
    must:
      - GitHub connection must be approved in the console once (it is created PENDING)
      - EC2 tag Application=ProjectName must match the deployment group filter
    ref:
      - { at: README.md, has: architecture + deploy/test/cleanup steps, scope: repo }
      - { at: appspec.yml, has: CodeDeploy lifecycle hooks, scope: repo }

Parameters:
  ProjectName:
    Type: String
    Default: nodejs-cicd
    AllowedPattern: '^[a-z][a-z0-9-]{2,19}$'
    ConstraintDescription: 3-20 characters - lowercase letters, digits and hyphens, starting with a letter.
    Description: Short lowercase name used in resource names and tags.
  GitHubRepository:
    Type: String
    Default: siva-tharan/aws-nodejs-cicd-pipeline
    AllowedPattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
    ConstraintDescription: Must be owner/repository.
    Description: GitHub repository in owner/name form (case-sensitive).
  BranchName:
    Type: String
    Default: main
    Description: Branch that triggers deployments.
  AllowedCidr:
    Type: String
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/(\d|[12]\d|3[0-2])$'
    ConstraintDescription: Must be an IPv4 CIDR such as 203.0.113.10/32.
    Description: Who may open the app on port 80. Use your own IP as x.x.x.x/32 (curl https://checkip.amazonaws.com).
  VpcCidr:
    Type: String
    Default: 10.60.0.0/16
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/16$'
    ConstraintDescription: Must be a /16 CIDR block.
    Description: CIDR block for the VPC.
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t3.medium]
    Description: EC2 instance type for the app server.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Amazon Linux 2023 AMI from the public SSM parameter.

Resources:
  # ---------------------------------------------------------------- Network
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-vpc'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-igw'

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 2, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-public'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-public-rt'

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: HTTP only from AllowedCidr; no SSH (SSM instead); egress HTTPS for CodeDeploy, S3, SSM, nodejs.org and npm
    Properties:
      GroupDescription: Node.js app server - HTTP from the allowed CIDR, HTTPS egress only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedCidr
          Description: Node.js app
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to CodeDeploy, S3, SSM, nodejs.org and the npm registry
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-app-sg'

  # ---------------------------------------------------------------- Artifacts
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: CodePipeline artifact store; source zips expire after 30 days; Retain so stack deletion never fails on a non-empty bucket
        must:
          - same region as the pipeline
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireArtifacts
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub '${ArtifactBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # ---------------------------------------------------------------- GitHub connection
  GitHubConnection:
    Type: AWS::CodeConnections::Connection
    Metadata:
      com.aws.cloudformation.Context:
        why: OAuth-based GitHub App connection instead of a personal access token
        must:
          - created PENDING; approve once in Console > Developer Tools > Settings > Connections
    Properties:
      ConnectionName: !Sub '${ProjectName}-github'
      ProviderType: GitHub

  # ---------------------------------------------------------------- EC2 app server
  AppServerRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: least privilege - SSM core + read revisions from the artifact bucket (what the CodeDeploy agent downloads)
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
      Policies:
        - PolicyName: read-deployment-artifacts
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadArtifacts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub '${ArtifactBucket.Arn}/*'
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  AppServerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref AppServerRole

  AppServerLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Metadata:
      com.aws.cloudformation.Context:
        why: IMDSv2 required; encrypted root; UserData only installs the CodeDeploy agent - Node.js itself is installed by the app's BeforeInstall hook
    Properties:
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt AppServerInstanceProfile.Arn
        SecurityGroupIds:
          - !GetAtt AppSecurityGroup.GroupId
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          HttpPutResponseHopLimit: 1
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            # Installs and starts the CodeDeploy agent from the regional AWS bucket.
            set -euxo pipefail
            dnf install -y ruby wget
            cd /tmp
            wget -q "https://aws-codedeploy-${AWS::Region}.s3.${AWS::Region}.${AWS::URLSuffix}/latest/install"
            chmod +x ./install
            ./install auto
            systemctl enable --now codedeploy-agent

  AppServer:
    Type: AWS::EC2::Instance
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref AppServerLaunchTemplate
        Version: !GetAtt AppServerLaunchTemplate.LatestVersionNumber
      SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-app'
        - Key: Application
          Value: !Ref ProjectName

  # ---------------------------------------------------------------- CodeDeploy
  CodeDeployServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSCodeDeployRole'
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  CodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ComputePlatform: Server

  DeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: targets instances by tag; AllAtOnce fits a single instance; auto-rollback when ValidateService fails
        must:
          - Ec2TagFilters must match the AppServer Application tag
    Properties:
      ApplicationName: !Ref CodeDeployApplication
      ServiceRoleArn: !GetAtt CodeDeployServiceRole.Arn
      DeploymentConfigName: CodeDeployDefault.AllAtOnce
      Ec2TagFilters:
        - Key: Application
          Value: !Ref ProjectName
          Type: KEY_AND_VALUE
      AutoRollbackConfiguration:
        Enabled: true
        Events:
          - DEPLOYMENT_FAILURE

  # ---------------------------------------------------------------- CodePipeline
  PipelineRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: least privilege - artifact bucket, this GitHub repo only, and this CodeDeploy app only
        must:
          - keep FullRepositoryId condition on UseConnection (else every repo the connection can see is exposed)
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: pipeline-least-privilege
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ArtifactBucket
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:GetBucketVersioning
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub '${ArtifactBucket.Arn}/*'
              - Sid: UseGitHubConnectionForThisRepoOnly
                Effect: Allow
                Action: codeconnections:UseConnection
                Resource: !Ref GitHubConnection
                Condition:
                  StringEquals:
                    codeconnections:FullRepositoryId: !Ref GitHubRepository
              - Sid: UseGitHubConnectionLegacyPrefix
                Effect: Allow
                Action: codestar-connections:UseConnection
                Resource: !Ref GitHubConnection
                Condition:
                  StringEquals:
                    codestar-connections:FullRepositoryId: !Ref GitHubRepository
              - Sid: DeployWithCodeDeploy
                Effect: Allow
                Action:
                  - codedeploy:CreateDeployment
                  - codedeploy:GetApplication
                  - codedeploy:GetApplicationRevision
                  - codedeploy:GetDeployment
                  - codedeploy:RegisterApplicationRevision
                Resource:
                  - !Sub 'arn:${AWS::Partition}:codedeploy:${AWS::Region}:${AWS::AccountId}:application:${CodeDeployApplication}'
                  - !Sub 'arn:${AWS::Partition}:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentgroup:${CodeDeployApplication}/${DeploymentGroup}'
              - Sid: ReadDeploymentConfig
                Effect: Allow
                Action: codedeploy:GetDeploymentConfig
                Resource: !Sub 'arn:${AWS::Partition}:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentconfig:*'
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Metadata:
      com.aws.cloudformation.Context:
        why: V2 + QUEUED so pushes deploy one at a time, in order; Source -> Deploy (CodeDeploy handles install + health check)
        must:
          - FullRepositoryId is case-sensitive owner/repo
    Properties:
      PipelineType: V2
      ExecutionMode: QUEUED
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: GitHub
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: !Ref GitHubConnection
                FullRepositoryId: !Ref GitHubRepository
                BranchName: !Ref BranchName
                OutputArtifactFormat: CODE_ZIP
                DetectChanges: true
              OutputArtifacts:
                - Name: SourceOutput
        - Name: Deploy
          Actions:
            - Name: DeployToEC2
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeploy
                Version: '1'
              Configuration:
                ApplicationName: !Ref CodeDeployApplication
                DeploymentGroupName: !Ref DeploymentGroup
              InputArtifacts:
                - Name: SourceOutput
      Tags:
        - Key: Project
          Value: !Ref ProjectName

Outputs:
  AppUrl:
    Description: Open the app (reachable only from AllowedCidr, after the first deployment)
    Value: !Sub 'http://${AppServer.PublicDnsName}/'
  PipelineName:
    Description: CodePipeline name
    Value: !Ref Pipeline
  GitHubConnectionArn:
    Description: Approve this connection once in the console (it starts as PENDING)
    Value: !Ref GitHubConnection
  AppServerId:
    Description: EC2 instance ID
    Value: !Ref AppServer
  ConnectToServer:
    Description: Open a shell on the server without SSH
    Value: !Sub 'aws ssm start-session --target ${AppServer} --region ${AWS::Region}'
