<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Node.js on EC2 via CodePipeline</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: #f4f6f8;
      color: #1d2733;
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 620px;
      background: #fff;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
    }
    .eyebrow {
      margin: 0;
      color: #d86613;
      font-weight: 600;
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    h1 { margin: 4px 0 12px; }
    .pipeline { color: #5b6b7c; }
    dl {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 6px 16px;
      margin: 24px 0 0;
    }
    dt { color: #5b6b7c; }
    dd { margin: 0; font-family: ui-monospace, Consolas, monospace; word-break: break-all; }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">End-to-end CI/CD</p>
    <h1>Hello from Express on Amazon EC2</h1>
    <p class="pipeline">GitHub push &rarr; CodePipeline &rarr; CodeDeploy &rarr; EC2</p>

    <dl>
      <dt>App version</dt>   <dd id="version">loading...</dd>
      <dt>Deployment ID</dt> <dd id="deployment">loading...</dd>
      <dt>Deployed at</dt>   <dd id="deployed-at">loading...</dd>
      <dt>Deploy group</dt>  <dd id="group">loading...</dd>
      <dt>Host</dt>          <dd id="host">loading...</dd>
      <dt>Node.js</dt>       <dd id="node">loading...</dd>
    </dl>
  </main>

  <script>
    fetch('/api/info')
      .then((res) => res.json())
      .then((info) => {
        const deployment = info.deployment || {};
        document.getElementById('version').textContent = info.version;
        document.getElementById('deployment').textContent = deployment.deploymentId || 'not deployed by CodeDeploy';
        document.getElementById('deployed-at').textContent = deployment.deployedAt || '-';
        document.getElementById('group').textContent = deployment.deploymentGroup || '-';
        document.getElementById('host').textContent = info.hostname;
        document.getElementById('node').textContent = info.node;
      })
      .catch(() => {
        document.getElementById('version').textContent = 'could not load /api/info';
      });
  </script>
</body>
</html>
